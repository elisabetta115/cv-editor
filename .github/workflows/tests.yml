# Runs the tests on GitHub at every push and pull request (they also run on your computer: python3 -m unittest).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"   # the oldest version the editor supports, without the optional Pillow
            pillow: false
          - python: "3.x"    # the newest version, with Pillow
            pillow: true
    name: Python ${{ matrix.python }}${{ matrix.pillow && ' with Pillow' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        if: matrix.pillow
        run: python -m pip install pillow
      - name: Run the tests (Chrome is already installed on GitHub's machines)
        run: python -m unittest -v
