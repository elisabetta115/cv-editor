# Runs the tests on GitHub at every push and pull request (they also run on your computer: python3 -m unittest).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"   # the oldest version the editor supports, without the optional Pillow
            pillow: false
          - os: ubuntu-latest
            python: "3.x"    # the newest version, with Pillow
            pillow: true
          - os: windows-latest
            python: "3.x"
            pillow: true
          - os: macos-latest
            python: "3.x"
            pillow: true
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || matrix.os == 'macos-latest' && 'macOS' || 'Linux' }}, Python ${{ matrix.python }}${{ matrix.pillow && ' with Pillow' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        if: matrix.pillow
        run: python -m pip install pillow
      - name: Run the tests (Chrome is already installed on GitHub's machines)
        run: python -m unittest -v
