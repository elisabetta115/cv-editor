<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Editor</title>
<meta name="cv-editor-token" content="__TOKEN__">
<link rel="stylesheet" href="/web/editor.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark"><i data-icon="file"></i></span><span class="brand-name">CV Editor</span></div>
  <button class="cv-btn" id="btn-cv" type="button" aria-haspopup="true"
          title="Open another person's CV, or create, import, export or delete a CV">
    <span class="avatar" id="cv-avatar"></span><span class="who"><small>CV</small><strong id="cv-name"></strong></span><i data-icon="chevron-down"></i></button>
  <span class="demo-badge" id="demo-badge" hidden title="An empty editor in a temporary folder: try anything, your CVs are not touched and everything disappears when you close it.">Demo · nothing is kept</span>
  <div class="segments" id="languages" role="group" aria-label="Language"></div>
  <span class="spacer"></span>
  <span class="status" id="status" role="status"></span>
  <button class="btn ghost" id="btn-find" type="button" aria-pressed="false" title="Find and replace words in this CV (Ctrl+F)" aria-label="Find and replace"><i data-icon="search"></i><span class="btn-label">Find</span></button>
  <button class="btn" id="btn-pdf" type="button" title="Download the PDF of the version you are looking at"><i data-icon="download"></i>PDF</button>
  <button class="btn primary" id="btn-save" type="button" title="Save the content (Ctrl+S)">Save</button>
</header>
<main>
  <nav class="sections" id="sections" aria-label="Sections of the CV"></nav>
  <div id="find" class="find" role="search" aria-label="Find and replace" hidden>
    <div class="find-row">
      <label class="find-box"><i data-icon="search"></i><input id="find-query" type="text" autocomplete="off" spellcheck="false" aria-label="Find"></label>
      <span class="find-count" id="find-count" aria-live="polite"></span>
      <button type="button" class="ico" id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous"><i data-icon="arrow-up"></i></button>
      <button type="button" class="ico" id="find-next" title="Next (Enter)" aria-label="Next"><i data-icon="arrow-down"></i></button>
      <button type="button" class="ico" id="find-close" title="Close (Esc)" aria-label="Close"><i data-icon="x"></i></button>
    </div>
    <div class="find-row">
      <label class="find-box"><i data-icon="replace"></i><input id="find-replace" type="text" autocomplete="off" spellcheck="false"
             placeholder="Replace with" aria-label="Replace with"></label>
      <button type="button" class="btn" id="find-one" title="Replace the words marked and go to the next ones (Enter, in “Replace with”)">Replace</button>
      <button type="button" class="btn" id="find-all" title="Replace them everywhere in this language (Ctrl+Enter, in “Replace with”)">Replace all</button>
    </div>
    <div class="find-row">
      <button type="button" class="find-opt" data-opt="matchCase" aria-pressed="false" title="Match case: “Rome” does not find “rome”">Aa</button>
      <button type="button" class="find-opt" data-opt="words" aria-pressed="false" title="Whole words only: “art” does not find “party”"><u>ab</u></button>
      <button type="button" class="find-opt" data-opt="links" aria-pressed="false"
              title="Link addresses too (https://…, the Link boxes). They are left out unless you switch this on, so that replacing a word does not break a link."><i data-icon="chain"></i></button>
      <span class="find-where" id="find-where"></span>
    </div>
  </div>
  <section id="form" aria-label="CV content"><p class="hint">Loading…</p></section>
  <section id="preview" aria-label="Preview">
    <div class="toolbar">
      <button type="button" class="tool style-btn" id="style-btn" aria-haspopup="true" title="Choose a style: search them and see your CV in each one">
        <i data-icon="layout"></i><span class="label">Style</span><strong id="style-name"></strong><i data-icon="chevron-down" class="chev"></i></button>
      <button type="button" class="tool" id="btn-color" aria-haspopup="true" title="Colour of this style">
        <span class="swatch-dot" id="color-dot"></span><span class="label">Colour</span><i data-icon="chevron-down" class="chev"></i></button>
      <button type="button" class="tool" id="btn-adjust" aria-haspopup="true"
              title="Adjust this style to your CV: text size, spacing and line spacing, to fit it on fewer pages or give it more air">
        <i data-icon="sliders"></i><span class="label">Adjust</span><i data-icon="chevron-down" class="chev"></i></button>
      <button type="button" class="tool" id="btn-sidebar" aria-pressed="false"
              title="A sidebar in every style. Choose what goes in it with the sidebar button next to each section, in the list on the left.">
        <i data-icon="sidebar"></i><span class="txt">Sidebar</span></button>
      <span class="tool-sep"></span>
      <button type="button" class="tool" id="btn-photo" aria-haspopup="true" title="Photo: choose one, add or remove photos"></button>
      <button type="button" class="tool" id="btn-frame" title="Frame the photo: position, zoom and shape"><i data-icon="crop"></i><span class="txt">Frame</span></button>
      <span class="spacer"></span>
      <div class="segments" id="view-mode" role="group" aria-label="View">
        <button type="button" data-v="live" title="Live preview while you type">Live</button>
        <button type="button" data-v="pages" title="The real pages, exactly as in the PDF">Pages</button>
      </div>
      <button type="button" class="tool" id="btn-fullscreen" title="Show the pages on the whole screen"></button>
    </div>
    <div class="frames">
      <iframe id="cv" title="CV preview" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      <iframe id="pages" title="CV pages" hidden></iframe>
    </div>
  </section>
</main>
<div id="language-panel" class="panel" hidden></div>
<div id="copy-panel" class="panel" hidden role="dialog" aria-label="Copy a language"></div>
<div id="frame-panel" class="panel" hidden role="dialog" aria-label="Frame the photo"></div>
<div id="color-panel" class="panel popover" hidden role="dialog" aria-label="Colour"><div id="colors" role="group" aria-label="Colour"></div></div>
<div id="adjust-panel" class="panel popover" hidden role="dialog" aria-label="Adjust the style to the CV"></div>
<div id="photo-panel" class="panel popover" hidden role="dialog" aria-label="Photo"></div>
<div id="add-menu" class="panel popover" hidden role="dialog" aria-label="Add a section"></div>
<div id="icon-panel" class="panel popover" hidden role="dialog" aria-label="Icon of the contact"></div>
<dialog id="names-dialog" aria-label="Names of companies and schools"></dialog>
<dialog id="ask-dialog"></dialog>
<dialog id="link-dialog" aria-label="Link"></dialog>
<dialog id="sync-dialog" aria-label="Bring the changes to the other languages"></dialog>
<div id="cv-panel" class="panel" hidden></div>
<div id="style-panel" class="panel" hidden role="dialog" aria-label="Styles"></div>
<div id="toast" role="alert"></div>
<div id="drop" hidden><div><i data-icon="upload"></i><strong>Drop the .zip file to import it</strong>
  <small>A CV exported by the CV editor (CV menu → Export), or a .zip of the cvs folder.</small></div></div>

<script type="module" src="/web/js/main.js"></script>
</body>
</html>
