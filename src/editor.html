    const one = existing.length === 1, names = existing.map(n => `“${n}”`).join(", ");
    for (const x of document.querySelectorAll(".panel")) x.hidden = x.id !== "cv-panel";
    renderCvPanel(h("div", { class: "choice" }, h("span", {}, one ? `There is already a CV called ${names}.` : `There are already CVs called ${names}.`),
      h("button", { type: "button", class: "btn", onclick: () => importCv(send, "replace", existing) }, one ? "Replace it" : "Replace them"),
      h("button", { type: "button", class: "btn", onclick: () => importCv(send, "copy") }, "Keep both"),
      h("button", { type: "button", class: "link", onclick: () => renderCvPanel() }, "Cancel")));
  } catch (e) { toast(e.message, { error: true }); }
}
// a .zip file dragged from the computer onto the editor (anywhere, the welcome screen too) is imported like "Import"
const draggingFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
function showDrop(on) { $("#drop").hidden = !on; }
function watchDrops(doc) {
  doc.addEventListener("dragenter", e => { if (draggingFiles(e)) { e.preventDefault(); showDrop(true); } });
  doc.addEventListener("dragover", e => { if (draggingFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
  doc.addEventListener("drop", e => {
    if (!draggingFiles(e)) return;
    e.preventDefault(); showDrop(false);
    const files = [...e.dataTransfer.files];
    if (files.length > 1) return toast("Drop one .zip file at a time.", { error: true });
    if (files.length) importFile(files[0]);
  });
}
watchDrops(document);
// the overlay covers the preview too: leaving it means leaving the window
$("#drop").addEventListener("dragleave", e => { if (e.target === $("#drop")) showDrop(false); });
async function importCv(send, mode, existing = []) {
  const one = existing.length === 1;
  if (mode === "replace" && !(await ask({ title: `Replace the ${one ? "CV" : "CVs"} of ${existing.join(", ")}?`,
      text: [`${one ? "Its" : "Their"} content, photos and PDFs are overwritten by the imported file.`],
      ok: "Replace", danger: true }))) return;
  if (!(await discardOk())) return;
  $("#cv-panel").hidden = true;
  status("Importing…", "busy");
  try {
    const r = await send(mode);
    S.changed = {}; S.photosChanged = S.settingsChanged = S.languagesChanged = false;
    await start(r.profiles[0]);
    status(`Imported ✓ ${r.profiles.join(", ")}`, "ok");
    if (r.profiles.length > 1) toast(`${r.profiles.length} CVs imported: switch between them with the CV menu (top left).`);
  } catch (e) { status("Import failed", "error"); toast(e.message, { error: true }); }
}

// ---------------------------------------------------------------- saving
// where the content of each fixed section is: [table, key] (no table = the top of the content)
const FIXED_CONTENT = { contacts: [[null, "contacts"]], details: [[null, "details"]], profile: [["person", "profile"]],
  about_me: [["person", "about_me"]], experience: [[null, "experience"]], education: [[null, "education"]],
  skills: [[null, "languages"], [null, "skills"]], interests: [[null, "interests"]] };
// When saving: the fixed sections taken out of the CV lose their content, in every language (until then Undo
// brings them back as they were). It is forgotten as a change too: there is nothing to bring to the other languages.
function dropRemovedContent() {
  for (const l of Object.keys(S.languages)) {
    const d = L(l).data;
    for (const k of removedFixed(l)) for (const [t, key] of FIXED_CONTENT[k] || []) {
      const owner = t ? d[t] : d;
      if (!isObj(owner) || !(key in owner)) continue;
      delete owner[key];
      delete S.base?.[l]?.twins.get(owner)?.[key];
    }
  }
}
let saving = false;
async function save() {
  if (saving) return false;
  saving = true;
  const version = S.version;
  $("#btn-save").disabled = true;
  status("Saving…", "busy");
  try {
    dropRemovedContent();
    for (const l in S.languages) sync(l);
    const r = await api("/api/save", { profile: S.profile, languages: Object.fromEntries(Object.entries(S.languages).map(([l, x]) => [l, x.data])),
                                       delete: [...S.deleted], settings: S.settings });
    if (S.version === version) S.changed = {};
    S.photosChanged = false; S.settingsChanged = false; S.languagesChanged = false;
    S.deleted.clear(); S.saved = new Set(Object.keys(S.languages));
    status("");  // the Save button says it
    return true;
  } catch (e) {
    status("Not saved", "error"); toast(e.message, { error: true });
    return false;
  } finally {
    saving = false; $("#btn-save").disabled = false; updateBar();
  }
}

// ---------------------------------------------------------------- preview
let previewTimer, request = 0, loaded = null, ready = false, pending = null;
function updatePreview(now = false) {
  if (S.view === "pages") return updatePages(now);
  clearTimeout(previewTimer);
  previewTimer = setTimeout(loadPreview, now ? 0 : 250);
}
async function loadPreview() {
  const n = ++request;
  try {
    sync(S.language);
    const req = viewRequest();
    const r = await api("/api/preview", req);
    if (n !== request) return;
    const frame = $("#cv"), key = [S.profile, S.style, S.language, req.color, r.sidebar].join("|");
    if (loaded === key) {
      if (ready) frame.contentDocument.body.innerHTML = r.page; else pending = r.page;
    } else {
      loaded = key; ready = false; pending = null;
      frame.srcdoc = r.document;
    }
  } catch (e) { status(e.message, "error"); }
}
function fitZoom() {
  const frame = $("#cv"), doc = frame.contentDocument;
  if (doc?.documentElement) doc.documentElement.style.zoom = Math.min(1.25, Math.max(0.3, (frame.clientWidth - 24) / 800));
}

// ---------------------------------------------------------------- start
// no CV yet: create one, import a file or try the example
function welcome() {
  closeFind(false);
  document.body.classList.add("empty");
  document.title = "CV Editor";
  const first = h("input", { class: "inp", placeholder: "First name" });
  const last = h("input", { class: "inp", placeholder: "Last name" });
  const language = h("select", { class: "inp" }, S.templates.map(t => h("option", { value: t.code }, t.name)));
  language.value = S.templates.some(t => t.code === "en") ? "en" : S.templates[0]?.code;
  fill($("#form"), h("div", { class: "welcome" },
    h("h1", {}, "Welcome to CV Editor"),
    h("p", {}, `Write your CV once and get it as PDF in several languages, ${S.styles.length || 50} styles and ${Object.keys(S.colors).length || 16} colours. Everything stays on this computer.`),
    card(h("span", { class: "fixed-title" }, "Start your CV"), [
      h("div", { class: "grid" }, first, last),
      wrap("Language of the CV", language, { hint: "You can add more languages later." }),
      h("button", { type: "button", class: "btn primary", style: "justify-self: start",
                    onclick: () => createCv(first.value, last.value, language.value) }, "Create my CV")]),
    card(h("span", { class: "fixed-title" }, "Already have a CV file?"), [
      h("p", { class: "hint", style: "margin: 0" }, "A .zip file exported from this editor, yours or someone else's, or a .zip of the cvs folder. ",
        "You can also drag it onto this window."),
      h("label", { class: "btn", style: "justify-self: start" }, "Import a CV (.zip)…", importInput())]),
    card(h("span", { class: "fixed-title" }, "Just looking?"), [
      h("p", { class: "hint", style: "margin: 0" }, "Open the CV of a fictional person to see what the editor can do."),
      h("button", { type: "button", class: "btn", style: "justify-self: start", onclick: async () => {
        try {
          const data = await api("/api/example");
          await importCv(mode => api("/api/import", { data, mode }), "copy");
        } catch (e) { toast(e.message, { error: true }); }
      } }, "Try the example")])));
  $("#cv").srcdoc = `<body style="margin:0;background:#e4e7ec;font:15px system-ui,sans-serif;display:grid;place-items:center;height:100vh">
    <div style="width:60%;aspect-ratio:210/297;background:#fff;border-radius:4px;box-shadow:0 10px 30px rgba(16,24,40,.15);display:grid;place-items:center;color:#98a1ad">
    Your CV will appear here</div></body>`;
  loaded = null;
}
async function start(name) {
  try {
    const cvs = await api("/api/cvs");
    S.profiles = cvs.profiles;
    $("#demo-badge").hidden = !cvs.demo;
    if (!S.profiles.length) {
      if (!S.templates.length) S.templates = (await api("/api/templates")).templates;
      return welcome();
    }
    document.body.classList.remove("empty");
    name = [name, lastOpened()].find(n => n && S.profiles.some(x => x.name === n)) || S.profiles[0].name;
    const r = await api("/api/data?cv=" + encodeURIComponent(name));
    Object.assign(S, { profile: r.profile, languages: {}, changed: {}, photosChanged: false, settingsChanged: false,
                       languagesChanged: false, deleted: new Set() });
    S.version++;
    loaded = null;
    remember(r.profile);
    document.title = `${r.profile} · CV Editor`;
    $("#cv-name").textContent = r.profile;
    $("#cv-avatar").textContent = r.profile.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
    S.section = "header"; S.sectionPos = 0; S.rendered = null;
    S.fixedSections = r.fixed_sections || [];
    for (const [l, x] of Object.entries(r.languages)) {
      const sections = x.data.sections || [];
      S.languages[l] = { data: x.data, name: x.name,
        order: x.order.map(o => (typeof o === "number" ? { section: sections[o] } : { fixed: o.builtin, hidden: !!o.hidden, side: !!o.side })) };
      sync(l);
    }
    S.photoList = r.photos; S.signature = r.signature;
    S.photo = r.photos[0]?.name ?? null;
    S.styles = r.styles; S.styleGroups = r.style_groups; S.colors = r.colors; S.settings = r.settings; S.templates = r.templates;
    S.canZoom = r.can_zoom; S.icons = r.icons; setContactKinds(r.contact_groups);
    if (!S.styles.some(x => x.id === S.style)) S.style = S.styles[0].id;
    S.sideSuggested = r.sidebar_suggested; S.lastSide = null;
    tagSections();
    S.base = {};
    for (const l of Object.keys(S.languages)) { sync(l); snapshot(l); }
    S.saved = new Set(Object.keys(r.languages));
    if (!S.languages[S.language]) S.language = Object.keys(S.languages)[0];
    renderStyles();
    renderLanguages();
    updateBar(); renderPhotos(); render(); updatePreview(true);
  } catch (e) {
    fill($("#form"), h("p", { class: "note" }, "Could not read the CV: " + e.message));
  }
}
$("#cv").addEventListener("load", () => {
  ready = true; fitZoom();
  if ($("#cv").contentDocument) watchDrops($("#cv").contentDocument);  // a .zip dragged in over the preview
  if (pending) { $("#cv").contentDocument.body.innerHTML = pending; pending = null; }
});
new ResizeObserver(fitZoom).observe($("#cv"));
$("#btn-sidebar").addEventListener("click", () => setSidebar(!hasSidebar()));
$("#btn-color").addEventListener("click", e => { e.stopPropagation(); colorPanel(); });
$("#btn-photo").addEventListener("click", e => { e.stopPropagation(); photoPanel(); });
$("#btn-frame").addEventListener("click", e => { e.stopPropagation(); framePanel(); });
$("#style-btn").addEventListener("click", e => { e.stopPropagation(); togglePanel("style-panel", () => renderStylePanel()); });
for (const b of document.querySelectorAll("#view-mode button")) b.addEventListener("click", () => setView(b.dataset.v));
$("#btn-fullscreen").addEventListener("click", toggleFullscreen);
$("#btn-save").addEventListener("click", save);
$("#btn-pdf").addEventListener("click", downloadPdf);
$("#btn-cv").addEventListener("click", e => { e.stopPropagation(); cvPanel(); });
// clicks inside a panel stay in the panel (its content may be redrawn while clicking)
for (const p of document.querySelectorAll(".panel")) p.addEventListener("click", e => { e.stopPropagation(); closeMenu(); });
document.addEventListener("click", e => {
  let closed = false;
  for (const p of document.querySelectorAll(".panel")) if (!p.hidden && !p.contains(e.target)) { p.hidden = true; closed = true; }
  if (!$("#menu")?.contains(e.target)) closeMenu();
  if (closed && S.settings) updateBar();
});
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
// find and replace: Ctrl+F, Ctrl+H (with the words to replace), F3 / Shift+F3 for the next and previous ones
$("#btn-find").addEventListener("click", () => (findOpen() ? closeFind(false) : openFind()));
$("#find-query").addEventListener("input", () => { clearTimeout(findTimer); findTimer = setTimeout(applyQuery, 150); });
$("#find-query").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); } });
$("#find-replace").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); if (e.ctrlKey || e.metaKey) replaceAll(); else replaceOne(); }
});
$("#find").addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); closeFind(); } });
$("#find-prev").addEventListener("click", () => findStep(-1));
$("#find-next").addEventListener("click", () => findStep(1));
$("#find-one").addEventListener("click", replaceOne);
$("#find-all").addEventListener("click", replaceAll);
$("#find-close").addEventListener("click", () => closeFind());
for (const b of document.querySelectorAll(".find-opt")) b.addEventListener("click", () => setFindOption(b.dataset.opt));
// clicking the buttons of the bar leaves the cursor in the box you were typing in
for (const b of document.querySelectorAll("#find button")) b.addEventListener("mousedown", e => e.preventDefault());
document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (key === "f" || key === "h")) {
    if (document.body.classList.contains("empty") || !L() || document.querySelector("dialog[open]")) return;
    e.preventDefault(); openFind(key === "h");
  } else if (e.key === "F3" && findOpen()) { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
});
// Ctrl+K in a text box that can hold links: the selected words become a link
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "k" && e.target.dataset?.links != null) { e.preventDefault(); linkDialog(e.target); }
});
window.addEventListener("beforeunload", e => { if (unsaved()) { e.preventDefault(); e.returnValue = ""; } });
start();
</script>
